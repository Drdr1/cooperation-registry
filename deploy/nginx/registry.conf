# Nginx in front of Tomcat. In production: add the TLS server block from
# docs/DEPLOYMENT.md and serve the Vue/Nuxt build from `root`.
upstream registry_tomcat {
    server app:8080;          # production: 127.0.0.1:8080
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # Frontend (separate job): static build of the Vue/Nuxt app.
    root /usr/share/nginx/html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(api|ws|v3/api-docs|swagger-ui|swagger-ui\.html|actuator/health) {
        proxy_pass http://registry_tomcat;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 120s;   # large report exports
    }
}
